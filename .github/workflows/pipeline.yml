name: Main Front Pipeline
on:
    push:
        branches:
            - main
jobs:
    avoid_conflicts:
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - name: Cancel conflicting runs
              uses: styfle/cancel-workflow-action@0.9.1
              with:
                  access_token: ${{ github.token }}
    deploy:
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 10
        steps:
            - name: Deploy to Contabo server
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.CONTABO_HOST }}
                  username: ${{ secrets.CONTABO_USERNAME }}
                  password: ${{ secrets.CONTABO_PASSWORD }}
                  port: 22
                  script: |
                      cd services/hosteo-front
                      git checkout main
                      ${{ secrets.GIT_PULL_COMMAND }}
                      yarn install
                      yarn build
                      rm -rf /var/www/hosteo_dist
                      mv dist /var/www/hosteo_dist

